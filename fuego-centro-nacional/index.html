<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101419">
  <title>Fuego Centro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/styles.css?v=461">
  <link rel="stylesheet" href="/v45.css?v=461">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
  <script src="/analytics-config.js"></script>
  <script src="/v46.js?v=461" defer></script>
  <script src="/v45.js?v=461" defer></script>
  <script src="/app.js?v=461" defer></script>
  <script src="/reset-after-app.js?v=461" defer></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">FC</span><div><b>Fuego Centro</b><small>buscador nacional · cobertura explicada · beta</small></div></div>
  <div id="sourceChips" class="chips" aria-label="Estado de las fuentes"><span class="chip stale">Conectando…</span></div>
  <button id="refreshBtn" class="iconBtn" aria-label="Actualizar datos">↻</button>
</header>
<div id="degraded" class="degraded" role="status" aria-live="assertive"></div>
<div class="mobileModeSwitch" role="group" aria-label="Vista en móvil"><button data-mobile-view="map">Mapa</button><button data-mobile-view="report">Informe</button></div>
<main class="shell">
<section class="mapWrap" aria-labelledby="mapHeading"><h1 id="mapHeading" class="srOnly">Mapa de incendios</h1><div class="mapTools"><select id="riskFilter"><option>Todos</option></select><button id="homeBtn">⌂ Vista inicial</button><button id="locateBtn">◎ Mi ubicación</button><button id="fitBtn">Ver todo</button></div><div id="map"></div></section>
<aside class="panel" aria-label="Información">
<div class="warning"><b>En una emergencia prevalecen ES-Alert, 112 y autoridades.</b></div>
<div id="preventionPanel" class="actionCard"><h2>Prevención meteorológica</h2><p>Consulta el peligro oficial de incendio forestal y su interpretación.</p><a id="aemetDangerLink" href="/api/fire-danger?lat=40.4167&lon=-3.7033">Comprobar peligro AEMET</a></div>
<div id="sharePanel" class="actionCard"><h2>Compartir informe</h2><button id="shareReportBtn">Compartir situación actual</button></div>
<nav class="tabs" role="tablist"><button class="tab on" data-tab="places">Localidades</button><button class="tab" data-tab="incidents">Incidentes</button><button class="tab" data-tab="alerts">Alertas</button><button class="tab" data-tab="news">Noticias</button><button class="tab" data-tab="sources">Fuentes</button></nav>
<section id="places" class="pane on"><form id="placeSearchForm"><input id="placeQuery" placeholder="Municipio, localidad o núcleo"><button>Consultar</button></form><div id="placeResults"></div><div id="localReport"></div></section>
<section id="incidents" class="pane"></section><section id="alerts" class="pane"></section><section id="news" class="pane"></section><section id="sources" class="pane"></section>
</aside></main>
<dialog id="incidentDialog"><div id="incidentDetail"></div></dialog>
</body></html>
